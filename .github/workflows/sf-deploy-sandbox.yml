name: Salesforce Sandbox Deployment

on:
  push:
    branches:
      - '**'
    branches-ignore:
      - master
      - production

# contents:write  — revert-on-failure pushes rollback commits
# pull-requests:write — create-promotion-pr opens the next-env PR
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sandbox-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      isDeployable: ${{ steps.resolve.outputs.isDeployable }}
      envName: ${{ steps.resolve.outputs.envName }}
      authSecret: ${{ steps.resolve.outputs.authSecret }}
      authType: ${{ steps.resolve.outputs.authType }}
      jwtClientIdSecret: ${{ steps.resolve.outputs.jwtClientIdSecret }}
      jwtUsernameSecret: ${{ steps.resolve.outputs.jwtUsernameSecret }}
      jwtPrivateKeySecret: ${{ steps.resolve.outputs.jwtPrivateKeySecret }}
      jwtLoginUrl: ${{ steps.resolve.outputs.jwtLoginUrl }}
      testLevel: ${{ steps.resolve.outputs.testLevel }}
      promotionTarget: ${{ steps.resolve.outputs.promotionTarget }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve sandbox target from branch
        id: resolve
        run: node scripts/ci/resolve-target-env.js sandbox "${{ github.ref_name }}"

  deploy-to-sandbox:
    needs: resolve-target
    if: needs.resolve-target.outputs.isDeployable == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to sandbox
        env:
          AUTH_TYPE: ${{ needs.resolve-target.outputs.authType }}
          AUTH_VALUE: ${{ secrets[needs.resolve-target.outputs.authSecret] }}
          JWT_CLIENT_ID: ${{ secrets[needs.resolve-target.outputs.jwtClientIdSecret] }}
          JWT_USERNAME: ${{ secrets[needs.resolve-target.outputs.jwtUsernameSecret] }}
          JWT_PRIVATE_KEY: ${{ secrets[needs.resolve-target.outputs.jwtPrivateKeySecret] }}
          JWT_LOGIN_URL: ${{ needs.resolve-target.outputs.jwtLoginUrl }}
        shell: bash
        run: |
          if [ "$AUTH_TYPE" = "jwt" ]; then
            if [ -z "$JWT_CLIENT_ID" ] || [ -z "$JWT_USERNAME" ] || [ -z "$JWT_PRIVATE_KEY" ]; then
              echo "JWT auth is configured but one or more JWT secrets are missing."
              exit 1
            fi

            printf '%s' "$JWT_PRIVATE_KEY" | sed 's/\\n/\n/g' > ./jwt.key
            sf org login jwt \
              --client-id "$JWT_CLIENT_ID" \
              --jwt-key-file ./jwt.key \
              --username "$JWT_USERNAME" \
              --instance-url "$JWT_LOGIN_URL" \
              --alias deploy-target
            rm -f ./jwt.key
            exit 0
          fi

          if [ -z "$AUTH_VALUE" ]; then
            echo "SFDX auth URL secret is empty or missing."
            exit 1
          fi

          AUTH_VALUE="$(printf '%s' "$AUTH_VALUE" | tr -d '\r')"
          if [[ "$AUTH_VALUE" != force://* ]]; then
            echo "SFDX auth URL secret has invalid format. Expected value to start with force://"
            exit 1
          fi

          printf '%s' "$AUTH_VALUE" > ./SFDX_AUTH_URL.txt
          sf org login sfdx-url --sfdx-url-file ./SFDX_AUTH_URL.txt --alias deploy-target
          rm -f ./SFDX_AUTH_URL.txt

      - name: Deploy source to sandbox
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org deploy-target \
            --test-level "${{ needs.resolve-target.outputs.testLevel }}" \
            --wait 120

  # Automatically reverts the merge commit when a deployment fails so the
  # environment branch is never left in a broken state.
  # The revert commit includes [skip ci] to prevent a deploy re-trigger loop.
  # NOTE: This push requires that branch protection for environment branches
  # either allows the github-actions bot to bypass push restrictions, or that
  # "Allow specified actors to bypass required pull requests" is enabled for
  # the GitHub Actions app.
  revert-on-failure:
    needs: [resolve-target, deploy-to-sandbox]
    if: needs.deploy-to-sandbox.result == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Revert failed merge commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Detect whether HEAD is a merge commit (2 parents) or a squash/direct commit.
          PARENT_COUNT=$(git cat-file -p HEAD | grep -c "^parent ")
          if [ "$PARENT_COUNT" -gt 1 ]; then
            git revert -m 1 --no-commit HEAD
          else
            git revert --no-commit HEAD
          fi

          git commit -m "revert: auto-rollback — deployment to ${{ needs.resolve-target.outputs.envName }} failed [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

  # After a successful deploy, automatically open a PR to promote the changes
  # to the next environment defined by promotionTarget in branch-environments.json.
  # The PR still requires a human to review and approve before the next deploy runs.
  # No PR is opened when promotionTarget is empty (e.g. the top environment).
  create-promotion-pr:
    needs: [resolve-target, deploy-to-sandbox]
    if: needs.deploy-to-sandbox.result == 'success' && needs.resolve-target.outputs.promotionTarget != ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Open promotion PR to next environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          TARGET_BRANCH: ${{ needs.resolve-target.outputs.promotionTarget }}
          ENV_NAME: ${{ needs.resolve-target.outputs.envName }}
        shell: bash
        run: |
          # Check whether a promotion PR already exists to avoid duplicates.
          EXISTING=$(gh pr list \
            --base "$TARGET_BRANCH" \
            --head "$SOURCE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "Promotion PR #$EXISTING already open from $SOURCE_BRANCH → $TARGET_BRANCH. Skipping."
            exit 0
          fi

          # Write the PR body to a file to avoid YAML/shell quoting issues.
          cat > /tmp/pr-body.md << 'PREOF'
          ## Automated Promotion PR

          This PR was opened automatically by GitHub Actions after a successful deployment.

          Review the changes, wait for PR validation to pass, then merge to trigger the next environment deploy.
          PREOF

          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$SOURCE_BRANCH" \
            --title "chore: promote ${SOURCE_BRANCH} to ${TARGET_BRANCH} after successful ${ENV_NAME} deploy" \
            --body-file /tmp/pr-body.md
